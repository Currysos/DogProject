<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What dog is next?</title>

    <link rel="stylesheet" href="style.css">
    <script src="bundle.js"></script>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar" id="compSidebar">
        <button onclick="closeSidebar()">Close</button>
        <a class="newComp" href="#">New Comp</a>
        <a href="#">Comp 1</a>
        <a href="#">Comp 2</a>
        <a href="#">Comp 3</a>
    </div>

    <header>
        <button class="sidebarButton" onclick="openSidebar()">☰</button>
        <h1>COMP NAME</h1>
        <div></div>
    </header>

    <script>
        // Sidebar functions
        function openSidebar() {
            document.getElementById("compSidebar").style.display = "block";
        }
        function closeSidebar() {
            document.getElementById("compSidebar").style.display = "none";
        }
    </script>

    <!-- MAIN -->
    <main>
        <article>
            <h2 id="compTitle">CLASS A - SIZE 1</h2>
            <ul id="dogs">
                <!-- List of dogs from database -->
            </ul>
            <form id="newDogForm">
                <label for="handler">Förare</label>
                <input type="text" name="handler" id="handler" value="Adam">

                <label for="dogName">Hundnamn</label>
                <input type="text" name="dogName" id="dogName" value="Eva">

                <label for="race">Ras</label>
                <input type="text" name="race" id="race" value="Fax">

                <label for="size">Storlek</label>
                <select name="size" id="size">
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>

                <label for="class">Klass</label>
                <input type="text" id="class" name="class" value="Agility A-1">
                </select>
                <button type="submit">Lägg Till</button>
            </form>
        </article>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav>
        <div>
            <button class="sizeButtons">Size 1</button>
            <button class="sizeButtons">Size 2</button>
            <button class="sizeButtons">Size 3</button>
        </div>
        <div>
            <button class="classButtons">Klass A</button>
            <button class="classButtons">Klass B</button>
            <button class="classButtons">Klass C</button>
            
        </div>
    </nav>
    <footer>
        <p>@Currysoft</p>
    </footer>
</body>
</html>
