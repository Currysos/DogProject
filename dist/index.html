<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What dog is next?</title>

    <link rel="stylesheet" href="style.css">
    <script src="bundle.js"></script>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar" id="compSidebar">
        <button onclick="closeSidebar()">Stäng</button>
        <a class="newComp" href="newComp.html">Ny Tävling</a>
    </div>

    <header>
        <button class="sidebarButton" onclick="openSidebar()">☰</button>
        <h1 id="compHeader"></h1>
        <div></div>
    </header>

    <!-- MAIN -->
    <main>
        <article>
            <h2 id="compTitle">CLASS A - SIZE 1</h2>
            <ul id="dogs">
                <!-- List of dogs from database -->
            </ul>

            <button onclick="showNewDogForm()" id="newDogButton">Ny Hund</button>

            <form id="newDogForm">
                <button onclick="hideNewDogForm()" id="hideNewDogFormButton">Stäng</button>

                <div>
                    <label for="handler">Förare: </label>
                    <input type="text" name="handler" id="handler" value="Adam">
                </div>

                <div>
                    <label for="dogName">Hundnamn: </label>
                    <input type="text" name="dogName" id="dogName" value="Eva">
                </div>

                <div>
                    <label for="race">Ras: </label>
                    <input type="text" name="race" id="race" value="Tax">
                </div>

                <div>
                    <label for="size">Storlek: </label>
                    <select name="size" id="size">
                        <option value="XS">XS</option>
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                    </select>
                </div>

                <div>
                    <label for="class">Klass: </label>
                    <input type="text" id="class" name="class" value="Agility A-1">
                </div>

                <button type="submit">Lägg Till</button>
            </form>
        </article>
    </main>

    <script>
        // Sidebar functions
        function openSidebar() {
            document.getElementById("compSidebar").style.left = "0px";
        }
        function closeSidebar() {
            document.getElementById("compSidebar").style.left = "-300px";
        }
        
        // Show new dog form functions
        function showNewDogForm() {
            document.getElementById("newDogForm").style.display = "flex";
            document.getElementById("newDogButton").style.display = "none";
        }
        function hideNewDogForm() {
            document.getElementById("newDogForm").style.display = "none";
            document.getElementById("newDogButton").style.display = "block";
        }
    </script>

    <!-- BOTTOM NAVIGATION -->
    <nav>
        <div id="sizes">
        </div>
        <div id="classes">
        </div>
    </nav>
    <footer>
        <p>@Currysoft</p>
    </footer>
</body>

</html>
